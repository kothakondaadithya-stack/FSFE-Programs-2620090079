<!--
content - actual text or image inside the element.
padding - Space between the content and the border.
Border - boundary surrounding the element.
Margin - Space outside the border. -->
<html>
    <head>
        <style>
            .box{
                width: 250px;
                padding: 20px;
                border: 5px solid blue;
                margin: 30px;
            background-color: lightblue;
            }
            </style>
    </head>
    <body>
        <h1>CSS Box Model</h1>
        <div class="box">
            <h2> ABC college</h2>
            <p>welcome to our college website.</P>
            </div>
        </body>
        </html>
