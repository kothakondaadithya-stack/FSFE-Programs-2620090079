        .box {
            width: 120px;
            height: 120px;
            background-color: lightblue;
            transition-property: background-color;
            transition-duration: 2s;
        }
       .box:hover {
            background-color: lightcoral
        }
    </style>
</head>

    <div class="box">hover me</div>
</body></html>
